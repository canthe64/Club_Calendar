name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # windows-latest, not ubuntu - this app's TimeZoneInfo IDs are the Windows convention
    # ("Pacific Standard Time", not the IANA "America/Los_Angeles"), matching
    # appsettings.Development.json's own TimeZone value. The deployment target is Azure App
    # Service on Linux (deployment guide Step 9), which resolves the same Windows-form IDs fine
    # via ICU - this runner just needs to exercise the same ID strings the app ships with.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test FacilityScheduler.Tests/FacilityScheduler.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults

      # coverlet.collector (referenced by the test project, per the --collect flag above) previously
      # had nothing consuming its output (code review O6) - published here so a coverage number is
      # visible without anyone needing to run the collector locally themselves.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
